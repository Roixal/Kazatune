<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181724" />
      <stop offset="50%" stop-color="#0E0D15" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Glass Rim Border Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#FF0050" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#00F2FE" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <radialGradient id="pinkGlow" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF0050" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FF0050" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="70%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0" />
    </radialGradient>

    <!-- Fluid Wave S Ribbon Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="35%" stop-color="#FF0050" />
      <stop offset="65%" stop-color="#9B51E0" />
      <stop offset="85%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- Gloss Sheen Overlay -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Base Icon Canvas with Drop Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" filter="url(#cardShadow)" />
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#purpleGlow)" />
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#pinkGlow)" />
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#cyanGlow)" />

  <!-- Subtle Concentric Vinyl Grooves -->
  <g opacity="0.12" stroke="#FFFFFF" fill="none" stroke-width="1.5">
    <circle cx="256" cy="256" r="180" stroke-dasharray="12 18" />
    <circle cx="256" cy="256" r="148" />
    <circle cx="256" cy="256" r="116" stroke-dasharray="8 14" />
    <circle cx="256" cy="256" r="84" />
  </g>

  <!-- Vertical Music Equalizer Pulse Columns (Subtle background) -->
  <g opacity="0.22" fill="#FFFFFF">
    <rect x="120" y="216" width="6" height="80" rx="3" />
    <rect x="136" y="186" width="6" height="140" rx="3" />
    <rect x="152" y="236" width="6" height="40" rx="3" />
    <rect x="354" y="236" width="6" height="40" rx="3" />
    <rect x="370" y="186" width="6" height="140" rx="3" />
    <rect x="386" y="216" width="6" height="80" rx="3" />
  </g>

  <!-- Glowing Soundwave Neon S Icon -->
  <!-- Top Arc of S -->
  <path d="M 330 160 C 310 115 200 110 180 165 C 165 205 210 235 256 256" 
        fill="none" 
        stroke="url(#waveGrad)" 
        stroke-width="34" 
        stroke-linecap="round" 
        filter="url(#neonShadow)" />

  <!-- Bottom Arc of S -->
  <path d="M 256 256 C 302 277 348 305 332 348 C 312 402 202 398 182 352" 
        fill="none" 
        stroke="url(#waveGrad)" 
        stroke-width="34" 
        stroke-linecap="round" 
        filter="url(#neonShadow)" />

  <!-- Center Musical Wave Ribbon Overlay -->
  <path d="M 330 160 C 310 115 200 110 180 165 C 165 205 210 235 256 256 C 302 277 348 305 332 348 C 312 402 202 398 182 352" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="12" 
        stroke-linecap="round" 
        opacity="0.88" />

  <!-- Pulsing Center Energy Orbs -->
  <circle cx="330" cy="160" r="14" fill="#FF3366" filter="url(#neonShadow)" />
  <circle cx="330" cy="160" r="6" fill="#FFFFFF" />

  <circle cx="256" cy="256" r="16" fill="#9B51E0" filter="url(#neonShadow)" />
  <circle cx="256" cy="256" r="7" fill="#FFFFFF" />

  <circle cx="182" cy="352" r="14" fill="#00F2FE" filter="url(#neonShadow)" />
  <circle cx="182" cy="352" r="6" fill="#FFFFFF" />

  <!-- Top Glass Sheen (Apple Liquid Glass Reflection) -->
  <path d="M 32 140 C 32 80 80 32 140 32 L 372 32 C 432 32 480 80 480 140 C 480 230 350 250 256 250 C 140 250 32 210 32 140 Z" 
        fill="url(#sheen)" />

  <!-- Metallic Glass Border Rim -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="none" stroke="url(#rimGrad)" stroke-width="2.5" />
</svg>
